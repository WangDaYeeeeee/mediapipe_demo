<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调试信息测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .test-section {
      margin: 20px 0;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    .test-button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }

    .test-button:hover {
      background: #00cc00;
    }

    /* 调试信息区域样式 */
    .debug-info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #00ff00;
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      z-index: 1000;
      max-width: 300px;
      border: 1px solid rgba(0, 255, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .debug-info h3 {
      margin: 0 0 10px 0;
      color: #00ff00;
      font-size: 14px;
      font-weight: bold;
    }

    .debug-info .debug-item {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
    }

    .debug-info .debug-label {
      color: #888;
    }

    .debug-info .debug-value {
      color: #00ff00;
      font-weight: bold;
    }

    .debug-info .debug-toggle {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid rgba(0, 255, 0, 0.5);
      color: #00ff00;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .debug-info .debug-toggle:hover {
      background: rgba(0, 255, 0, 0.3);
    }

    .debug-info.hidden {
      opacity: 0.3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 调试信息区域 -->
  <div class="debug-info" id="debugInfo">
    <button class="debug-toggle" id="debugToggle">隐藏</button>
    <h3>调试信息</h3>
    <div class="debug-item">
      <span class="debug-label">人脸区域:</span>
      <span class="debug-value" id="faceArea">未检测</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">宽度:</span>
      <span class="debug-value" id="faceWidth">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">高度:</span>
      <span class="debug-value" id="faceHeight">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">X坐标:</span>
      <span class="debug-value" id="faceX">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">Y坐标:</span>
      <span class="debug-value" id="faceY">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">状态:</span>
      <span class="debug-value" id="faceStatus">未检测</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">关键点:</span>
      <span class="debug-value" id="landmarkCount">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">眨眼状态:</span>
      <span class="debug-value" id="blinkStatus">-</span>
    </div>
    <div class="debug-item">
      <span class="debug-label">张嘴状态:</span>
      <span class="debug-value" id="mouthStatus">-</span>
    </div>
  </div>

  <div class="test-container">
    <h1>调试信息功能测试</h1>
    
    <div class="test-section">
      <h2>测试调试信息显示</h2>
      <p>点击下面的按钮来测试调试信息的显示功能：</p>
      <button class="test-button" onclick="testDebugInfo()">测试调试信息</button>
      <button class="test-button" onclick="clearDebugInfo()">清除调试信息</button>
      <button class="test-button" onclick="toggleDebugInfo()">切换显示/隐藏</button>
    </div>

    <div class="test-section">
      <h2>模拟人脸检测数据</h2>
      <p>模拟不同的人脸检测结果：</p>
      <button class="test-button" onclick="simulateFaceDetection()">模拟检测成功</button>
      <button class="test-button" onclick="simulateNoFace()">模拟未检测到人脸</button>
      <button class="test-button" onclick="simulateMultipleFaces()">模拟检测到多张人脸</button>
    </div>

    <div class="test-section">
      <h2>说明</h2>
      <p>这个测试页面用于验证调试信息功能是否正常工作。调试信息区域会显示在页面左上角，包含以下信息：</p>
      <ul>
        <li>人脸区域坐标</li>
        <li>人脸宽度和高度</li>
        <li>人脸位置坐标</li>
        <li>检测状态</li>
        <li>关键点数量</li>
        <li>眨眼和张嘴状态</li>
      </ul>
      <p>你可以通过右上角的"隐藏/显示"按钮来控制调试信息的显示状态。</p>
    </div>
  </div>

  <script>
    // 调试信息切换功能
    const debugToggle = document.getElementById('debugToggle');
    const debugInfo = document.getElementById('debugInfo');
    
    debugToggle.addEventListener('click', () => {
      const isHidden = debugInfo.classList.contains('hidden');
      if (isHidden) {
        debugInfo.classList.remove('hidden');
        debugToggle.textContent = '隐藏';
      } else {
        debugInfo.classList.add('hidden');
        debugToggle.textContent = '显示';
      }
    });

    // 更新调试信息的函数
    function updateDebugInfo(data) {
      const elements = {
        faceArea: document.getElementById('faceArea'),
        faceWidth: document.getElementById('faceWidth'),
        faceHeight: document.getElementById('faceHeight'),
        faceX: document.getElementById('faceX'),
        faceY: document.getElementById('faceY'),
        faceStatus: document.getElementById('faceStatus'),
        landmarkCount: document.getElementById('landmarkCount'),
        blinkStatus: document.getElementById('blinkStatus'),
        mouthStatus: document.getElementById('mouthStatus')
      };

      if (data.error) {
        // 显示错误信息
        elements.faceStatus.textContent = data.error;
        elements.faceArea.textContent = '未检测';
        elements.faceWidth.textContent = '-';
        elements.faceHeight.textContent = '-';
        elements.faceX.textContent = '-';
        elements.faceY.textContent = '-';
        elements.landmarkCount.textContent = '-';
        elements.blinkStatus.textContent = '-';
        elements.mouthStatus.textContent = '-';
      } else {
        // 显示成功信息
        elements.faceStatus.textContent = '检测成功';
        elements.faceArea.textContent = `${data.minX},${data.minY} - ${data.maxX},${data.maxY}`;
        elements.faceWidth.textContent = `${data.faceWidth}px`;
        elements.faceHeight.textContent = `${data.faceHeight}px`;
        elements.faceX.textContent = `${data.minX}px`;
        elements.faceY.textContent = `${data.minY}px`;
        elements.landmarkCount.textContent = data.landmarkCount || '468';
        elements.blinkStatus.textContent = data.isBlinking ? '眨眼' : '睁眼';
        elements.mouthStatus.textContent = data.isMouthOpen ? '张嘴' : '闭嘴';
      }
    }

    // 测试函数
    function testDebugInfo() {
      updateDebugInfo({
        minX: 150,
        minY: 120,
        maxX: 330,
        maxY: 300,
        faceWidth: 180,
        faceHeight: 180,
        landmarkCount: 468,
        isBlinking: false,
        isMouthOpen: false
      });
    }

    function clearDebugInfo() {
      updateDebugInfo({
        error: '未检测'
      });
    }

    function toggleDebugInfo() {
      debugToggle.click();
    }

    function simulateFaceDetection() {
      updateDebugInfo({
        minX: 160,
        minY: 140,
        maxX: 320,
        maxY: 280,
        faceWidth: 160,
        faceHeight: 140,
        landmarkCount: 468,
        isBlinking: Math.random() > 0.5,
        isMouthOpen: Math.random() > 0.5
      });
    }

    function simulateNoFace() {
      updateDebugInfo({
        error: '❗️ 未检测到人脸'
      });
    }

    function simulateMultipleFaces() {
      updateDebugInfo({
        error: '❗️ 检测到多张人脸'
      });
    }

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', () => {
      console.log('调试信息测试页面已加载');
    });
  </script>
</body>
</html>
