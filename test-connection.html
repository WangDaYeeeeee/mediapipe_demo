<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .ip-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 网络连接测试</h1>
        
        <div class="status info">
            📱 请在手机浏览器中访问此页面
        </div>
        
        <div class="ip-info">
            <strong>电脑IP地址:</strong><br>
            172.20.10.5:3000
        </div>
        
        <div class="status success">
            ✅ 服务器运行正常
        </div>
        
        <div class="status info">
            📋 测试步骤:<br>
            1. 确保手机和电脑连接同一热点<br>
            2. 在手机浏览器输入: https://172.20.10.5:3000<br>
            3. 忽略安全警告，点击"继续访问"
        </div>
        
        <button onclick="testConnection()">🔄 测试连接</button>
        <button onclick="location.reload()">🔄 刷新页面</button>
        
        <div id="testResult"></div>
    </div>

    <script>
        function testConnection() {
            const resultDiv = document.getElementById('testResult');
            resultDiv.innerHTML = '<div class="status info">🔄 正在测试连接...</div>';
            
            // 测试本地连接
            fetch('/')
                .then(response => {
                    if (response.ok) {
                        resultDiv.innerHTML = '<div class="status success">✅ 本地连接正常</div>';
                    } else {
                        resultDiv.innerHTML = '<div class="status error">❌ 本地连接失败</div>';
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = '<div class="status error">❌ 连接错误: ' + error.message + '</div>';
                });
        }
        
        // 页面加载时显示当前时间
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-CN');
            const container = document.querySelector('.container');
            const timeDiv = document.createElement('div');
            timeDiv.className = 'status info';
            timeDiv.innerHTML = `🕐 当前时间: ${timeString}`;
            container.appendChild(timeDiv);
        });
    </script>
</body>
</html>
