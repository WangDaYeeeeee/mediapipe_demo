<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圆形预览框测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 圆形预览框 */
    .preview-container {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      min-width: 100px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .info {
      color: white;
      text-align: center;
      font-size: 14px;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="info">
      测试圆形预览框优化效果<br>
      摄像头画面和人脸网格应该正确显示在圆形区域内
    </div>

    <!-- 圆形预览框 -->
    <div class="preview-container" id="previewContainer">
      <video id="video" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="canvas"></canvas>
    </div>

    <!-- 按钮区域 -->
    <div class="button-area">
      <button class="btn" id="startBtn">开始测试</button>
      <button class="btn" id="stopBtn" disabled>停止</button>
    </div>
  </div>

  <script type="module">
    import { FaceDetector } from './src/face_detection.ts';

    class CircularPreviewTest {
      private video = document.getElementById('video') as HTMLVideoElement;
      private canvas = document.getElementById('canvas') as HTMLCanvasElement;
      private ctx = this.canvas.getContext('2d')!;
      private startBtn = document.getElementById('startBtn') as HTMLButtonElement;
      private stopBtn = document.getElementById('stopBtn') as HTMLButtonElement;
      private faceDetector: FaceDetector | undefined;
      private isRunning = false;

      constructor() {
        this.initializeElements();
        this.initializeMediaPipe();
        this.bindEvents();
      }

      private initializeElements(): void {
        this.resizeCanvas();
        window.addEventListener('resize', () => {
          this.resizeCanvas();
          if (this.isRunning) {
            this.optimizeCircularPreview();
          }
        });
      }

      private resizeCanvas(): void {
        const previewContainer = this.video.parentElement as HTMLElement;
        if (!previewContainer) return;
        
        const containerRect = previewContainer.getBoundingClientRect();
        const containerSize = Math.min(containerRect.width, containerRect.height);
        
        this.canvas.width = containerSize;
        this.canvas.height = containerSize;
        this.canvas.style.width = containerSize + 'px';
        this.canvas.style.height = containerSize + 'px';
      }

      private optimizeCircularPreview(): void {
        const previewContainer = this.video.parentElement as HTMLElement;
        if (!previewContainer) return;

        const containerRect = previewContainer.getBoundingClientRect();
        const containerSize = Math.min(containerRect.width, containerRect.height);
        
        if (this.video.videoWidth && this.video.videoHeight) {
          this.canvas.width = containerSize;
          this.canvas.height = containerSize;
          
          this.canvas.style.width = containerSize + 'px';
          this.canvas.style.height = containerSize + 'px';
          
          this.video.style.width = containerSize + 'px';
          this.video.style.height = containerSize + 'px';
          this.video.style.objectFit = 'cover';
        }
      }

      private async initializeMediaPipe(): Promise<void> {
        this.faceDetector = new FaceDetector({
          cpuContext: this.ctx,
          canvasSizer: () => ({ width: this.canvas.width, height: this.canvas.height })
        });
      }

      private bindEvents(): void {
        this.startBtn.addEventListener('click', () => this.startTest());
        this.stopBtn.addEventListener('click', () => this.stopTest());
      }

      private async startTest(): Promise<void> {
        try {
          this.startBtn.disabled = true;

          this.video.srcObject = await navigator.mediaDevices.getUserMedia({ 
            video: {
              width: { ideal: 1280, min: 640 },
              height: { ideal: 720, min: 480 },
              facingMode: 'user',
              aspectRatio: { ideal: 16/9 }
            } 
          });

          this.video.addEventListener('loadeddata', () => {
            this.isRunning = true;
            this.stopBtn.disabled = false;
            this.optimizeCircularPreview();
            this.startDetection();
          });

        } catch (error) {
          console.error('启动失败:', error);
          this.startBtn.disabled = false;
        }
      }

      private startDetection(): void {
        if (!this.isRunning) return;

        this.optimizeCircularPreview();

        try {
          const result = this.faceDetector?.detect(this.video);
          if (result && typeof result !== 'string') {
            console.log('检测到人脸');
          }
        } catch (error) {
          console.error('检测错误:', error);
        }

        if (this.isRunning) {
          window.requestAnimationFrame(() => this.startDetection());
        }
      }

      private stopTest(): void {
        this.isRunning = false;
        this.startBtn.disabled = false;
        this.stopBtn.disabled = true;
        
        if (this.video.srcObject) {
          const stream = this.video.srcObject as MediaStream;
          stream.getTracks().forEach(track => track.stop());
          this.video.srcObject = null;
        }
        
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }
    }

    // 页面加载完成后初始化测试
    document.addEventListener('DOMContentLoaded', () => {
      new CircularPreviewTest();
    });
  </script>
</body>
</html>
