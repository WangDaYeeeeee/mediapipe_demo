<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人脸朝向检测测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #000;
      color: white;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .video-container {
      position: relative;
      width: 400px;
      height: 300px;
      margin: 20px auto;
      border: 2px solid #333;
    }
    
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .info {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    }
    
    .status {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }
    
    .status-item {
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
    }
    
    .status-ok {
      background: #4CAF50;
    }
    
    .status-error {
      background: #f44336;
    }
    
    button {
      background: #2196F3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    
    button:hover {
      background: #1976D2;
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>人脸朝向检测测试</h1>
    
    <div class="video-container">
      <video id="video" autoplay muted></video>
      <canvas id="canvas"></canvas>
    </div>
    
    <div class="info">
      <h3>检测结果：</h3>
      <div class="status">
        <div class="status-item" id="yawStatus">Yaw: --</div>
        <div class="status-item" id="pitchStatus">Pitch: --</div>
        <div class="status-item" id="rollStatus">Roll: --</div>
      </div>
      <div class="status">
        <div class="status-item" id="orientationStatus">朝向: --</div>
      </div>
      <p id="tip">请将脸部对准摄像头，保持正对</p>
    </div>
    
    <div>
      <button id="startBtn">开始检测</button>
      <button id="stopBtn" disabled>停止检测</button>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js";

    class OrientationTest {
      constructor() {
        this.video = document.getElementById('video');
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.startBtn = document.getElementById('startBtn');
        this.stopBtn = document.getElementById('stopBtn');
        
        this.faceLandmarker = null;
        this.drawingUtils = null;
        this.webcamRunning = false;
        
        this.bindEvents();
        this.initializeMediaPipe();
      }
      
      async initializeMediaPipe() {
        try {
          const vision = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
          );
          
          this.faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "GPU"
            },
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true,
            runningMode: "VIDEO"
          });
          
          this.drawingUtils = new DrawingUtils(this.ctx);
          console.log('MediaPipe 初始化成功');
        } catch (error) {
          console.error('MediaPipe 初始化失败:', error);
        }
      }
      
      bindEvents() {
        this.startBtn.addEventListener('click', () => this.startDetection());
        this.stopBtn.addEventListener('click', () => this.stopDetection());
      }
      
      async startDetection() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: 640, 
              height: 480,
              facingMode: 'user'
            } 
          });
          
          this.video.srcObject = stream;
          this.webcamRunning = true;
          this.startBtn.disabled = true;
          this.stopBtn.disabled = false;
          
          this.canvas.width = this.video.videoWidth;
          this.canvas.height = this.video.videoHeight;
          
          this.predictWebcam();
        } catch (error) {
          console.error('启动摄像头失败:', error);
        }
      }
      
      stopDetection() {
        this.webcamRunning = false;
        this.startBtn.disabled = false;
        this.stopBtn.disabled = true;
        
        if (this.video.srcObject) {
          const stream = this.video.srcObject;
          stream.getTracks().forEach(track => track.stop());
          this.video.srcObject = null;
        }
        
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.updateStatus('--', '--', '--', false);
      }
      
      async predictWebcam() {
        if (!this.webcamRunning) return;
        
        try {
          const startTimeMs = performance.now();
          const results = this.faceLandmarker.detectForVideo(this.video, startTimeMs);
          
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          
          if (results.faceLandmarks && results.faceLandmarks.length > 0) {
            const landmarks = results.faceLandmarks[0];
            const blendshapes = results.faceBlendshapes[0];
            const transformationMatrix = results.facialTransformationMatrixes[0];
            
            // 计算朝向
            const orientation = this.calculateFaceOrientation(landmarks, transformationMatrix);
            const isFacingForward = this.checkFaceOrientation(orientation);
            
            // 更新状态显示
            this.updateStatus(
              orientation.yaw.toFixed(1),
              orientation.pitch.toFixed(1),
              orientation.roll.toFixed(1),
              isFacingForward
            );
            
            // 绘制人脸特征点
            this.drawFaceLandmarks(landmarks);
          } else {
            this.updateStatus('--', '--', '--', false);
          }
          
          if (this.webcamRunning) {
            requestAnimationFrame(() => this.predictWebcam());
          }
        } catch (error) {
          console.error('检测过程中发生错误:', error);
          if (this.webcamRunning) {
            requestAnimationFrame(() => this.predictWebcam());
          }
        }
      }
      
      calculateFaceOrientation(landmarks, transformationMatrix) {
        // 优先使用变换矩阵
        if (transformationMatrix) {
          const matrix = transformationMatrix;
          const rotationMatrix = [
            [matrix.data[0], matrix.data[1], matrix.data[2]],
            [matrix.data[4], matrix.data[5], matrix.data[6]],
            [matrix.data[8], matrix.data[9], matrix.data[10]]
          ];
          
          const yaw = Math.atan2(rotationMatrix[2][1], rotationMatrix[2][2]) * 180 / Math.PI;
          const pitch = Math.asin(-rotationMatrix[2][0]) * 180 / Math.PI;
          const roll = Math.atan2(rotationMatrix[1][0], rotationMatrix[0][0]) * 180 / Math.PI;
          
          return { yaw, pitch, roll };
        }
        
        // 备用方法：使用关键点计算
        return this.calculateFaceOrientationFromLandmarks(landmarks);
      }
      
      calculateFaceOrientationFromLandmarks(landmarks) {
        // 简化的关键点计算方法
        const leftEye = landmarks[159]; // 左眼中心
        const rightEye = landmarks[386]; // 右眼中心
        const nose = landmarks[1]; // 鼻子尖端
        
        // 计算roll（头部倾斜）
        const eyeAngle = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x) * 180 / Math.PI;
        const roll = eyeAngle;
        
        // 计算yaw（左右转动）- 简化版本
        const eyeCenterX = (leftEye.x + rightEye.x) / 2;
        const yaw = (nose.x - eyeCenterX) * 100; // 简化的yaw计算
        
        // 计算pitch（上下点头）- 简化版本
        const eyeCenterY = (leftEye.y + rightEye.y) / 2;
        const pitch = (nose.y - eyeCenterY) * 100; // 简化的pitch计算
        
        return { yaw, pitch, roll };
      }
      
      checkFaceOrientation(orientation) {
        const yawThreshold = 15;
        const pitchThreshold = 15;
        const rollThreshold = 15;
        
        const isYawOK = Math.abs(orientation.yaw) < yawThreshold;
        const isPitchOK = Math.abs(orientation.pitch) < pitchThreshold;
        const isRollOK = Math.abs(orientation.roll) < rollThreshold;
        
        return isYawOK && isPitchOK && isRollOK;
      }
      
      updateStatus(yaw, pitch, roll, isFacingForward) {
        document.getElementById('yawStatus').textContent = `Yaw: ${yaw}°`;
        document.getElementById('pitchStatus').textContent = `Pitch: ${pitch}°`;
        document.getElementById('rollStatus').textContent = `Roll: ${roll}°`;
        
        const orientationStatus = document.getElementById('orientationStatus');
        orientationStatus.textContent = `朝向: ${isFacingForward ? '正对' : '偏离'}`;
        orientationStatus.className = `status-item ${isFacingForward ? 'status-ok' : 'status-error'}`;
        
        const tip = document.getElementById('tip');
        if (isFacingForward) {
          tip.textContent = '很好！请保持这个姿势';
        } else {
          const { yaw, pitch, roll } = { yaw: parseFloat(yaw), pitch: parseFloat(pitch), roll: parseFloat(roll) };
          let tipText = '请调整：';
          
          if (Math.abs(yaw) > 15) {
            tipText += yaw > 0 ? '向左转' : '向右转';
          } else if (Math.abs(pitch) > 15) {
            tipText += pitch > 0 ? '向下看' : '向上看';
          } else if (Math.abs(roll) > 15) {
            tipText += roll > 0 ? '向左倾斜' : '向右倾斜';
          }
          
          tip.textContent = tipText;
        }
      }
      
      drawFaceLandmarks(landmarks) {
        try {
          // 绘制脸部轮廓
          this.drawingUtils.drawConnectors(
            landmarks,
            FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,
            { color: "#00ff00", lineWidth: 2 }
          );
          
          // 绘制眼睛
          this.drawingUtils.drawConnectors(
            landmarks,
            FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,
            { color: "#30ff30", lineWidth: 2 }
          );
          
          this.drawingUtils.drawConnectors(
            landmarks,
            FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,
            { color: "#30ff30", lineWidth: 2 }
          );
          
          // 绘制嘴唇
          this.drawingUtils.drawConnectors(
            landmarks,
            FaceLandmarker.FACE_LANDMARKS_LIPS,
            { color: "#ff3030", lineWidth: 2 }
          );
        } catch (error) {
          console.error('绘制人脸特征点时发生错误:', error);
        }
      }
    }
    
    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      new OrientationTest();
    });
  </script>
</body>
</html>
