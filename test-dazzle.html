<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>炫彩打光测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 炫彩背景 */
    .color-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: background-color 0.1s ease;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .test-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 16px;
      font-weight: 500;
      width: 100%;
      max-width: 300px;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <!-- 炫彩背景 -->
  <div class="color-background" id="colorBackground"></div>

  <div class="container">
    <div class="test-area">
      <h2>炫彩打光测试</h2>
      <p>点击按钮开始测试新的炫彩效果</p>
      <button class="btn" id="testBtn">开始测试</button>
      <div class="status" id="status">等待测试...</div>
    </div>
  </div>

  <script>
    class DazzleTest {
      constructor() {
        this.colorBackground = document.getElementById('colorBackground');
        this.testBtn = document.getElementById('testBtn');
        this.status = document.getElementById('status');
        
        this.testBtn.addEventListener('click', () => this.startTest());
      }

      async startTest() {
        this.testBtn.disabled = true;
        this.status.textContent = '测试中...';
        
        try {
          await this.dazzle();
          this.status.textContent = '测试完成！';
        } catch (error) {
          this.status.textContent = '测试失败: ' + error.message;
        } finally {
          this.testBtn.disabled = false;
        }
      }

      async dazzle() {
        return new Promise(async (resolve, _) => {
          const colorList = [
            [0, 0, 0, 76],
            [115, 26, 67, 159],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [31, 191, 70, 242],
            [31, 191, 70, 242],
            [31, 191, 70, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [230, 53, 135, 242],
            [115, 26, 67, 159],
            [0, 0, 0, 76],
            [204, 204, 204, 17]
          ];
          
          let currentIndex = 0;
          
          const updateColor = () => {
            if (currentIndex < colorList.length) {
              const [r, g, b, a] = colorList[currentIndex];
              
              // 在炫彩打光过程中，每个颜色都叠加白色背景以提升打光效率
              const whiteAlpha = 0.3; // 白色背景的透明度
              const colorAlpha = a / 255;
              
              // 计算白色背景和炫彩颜色的混合效果
              const mixedR = Math.round(r * colorAlpha + 255 * whiteAlpha * (1 - colorAlpha));
              const mixedG = Math.round(g * colorAlpha + 255 * whiteAlpha * (1 - colorAlpha));
              const mixedB = Math.round(b * colorAlpha + 255 * whiteAlpha * (1 - colorAlpha));
              const mixedA = colorAlpha + whiteAlpha * (1 - colorAlpha);
              
              this.colorBackground.style.backgroundColor = `rgba(${mixedR}, ${mixedG}, ${mixedB}, ${mixedA})`;
              this.colorBackground.style.opacity = '1';
              this.status.textContent = `颜色 ${currentIndex + 1}/${colorList.length}: [${r}, ${g}, ${b}, ${a}] + 白色背景`;
              currentIndex++;
              setTimeout(updateColor, 120);
            } else {
              this.colorBackground.style.opacity = '0';
              resolve();
            }
          };
          
          updateColor();
        });
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      new DazzleTest();
    });
  </script>
</body>
</html>
