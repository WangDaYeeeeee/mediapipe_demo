<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刷脸核验</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 炫彩背景动画 */
    .color-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff, #ffff00);
      background-size: 400% 400%;
      animation: colorShift 2s ease-in-out;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes colorShift {
      0% { opacity: 0; background-position: 0% 50%; }
      50% { opacity: 0.8; background-position: 100% 50%; }
      100% { opacity: 0; background-position: 0% 50%; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* 提示区域 */
    .tip-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 15px 20px;
      text-align: center;
      color: white;
      font-size: 16px;
      font-weight: 500;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 300px;
    }

    /* 圆形预览框 */
    .preview-container {
      position: relative;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: scaleX(-1);
    }

    /* 取景器指示器 */
    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(255, 255, 255, 0); /* 暂时隐藏 */
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    /* 按钮区域 */
    .button-area {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      min-width: 100px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn.terminate {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
    }

    /* 结果展示区域 */
    .result-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .result-photo {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
    }

    .result-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-text {
      color: white;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }

    /* 进度指示器 */
    .progress-indicator {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .progress-step {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
    }

    .progress-step.active {
      background: #00ff00;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    .progress-step.completed {
      background: #00ff00;
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      .container {
        padding: 15px;
        gap: 15px;
      }

      .preview-container {
        width: 250px;
        height: 250px;
      }

      .viewfinder {
        width: 180px;
        height: 180px;
      }

      .tip-area {
        font-size: 14px;
        padding: 12px 16px;
        min-height: 50px;
      }

      .btn {
        padding: 10px 20px;
        font-size: 14px;
        min-width: 80px;
      }

      .result-photo {
        width: 250px;
        height: 250px;
      }
    }

    /* 加载动画 */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 成功动画 */
    .success-animation {
      animation: successPulse 0.6s ease-in-out;
    }

    @keyframes successPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <!-- 炫彩背景 -->
  <div class="color-background" id="colorBackground"></div>

  <div class="container">
    <!-- 提示区域 -->
    <div class="tip-area" id="tipArea">
      请将脸部对准圆形取景器
    </div>

    <!-- 圆形预览框 -->
    <div class="preview-container" id="previewContainer">
      <video id="video" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="viewfinder" id="viewfinder"></div>
    </div>

    <!-- 进度指示器 -->
    <div class="progress-indicator" id="progressIndicator">
      <div class="progress-step" data-step="position"></div>
      <div class="progress-step" data-step="blink"></div>
      <div class="progress-step" data-step="mouth"></div>
      <div class="progress-step" data-step="light"></div>
    </div>

    <!-- 按钮区域 -->
    <div class="button-area">
      <button class="btn" id="startBtn">开始核验</button>
      <button class="btn terminate" id="terminateBtn" disabled>终止</button>
    </div>

    <!-- 结果展示区域 -->
    <div class="result-area" id="resultArea">
      <div class="result-photo" id="resultPhoto"></div>
      <div class="result-text">核验完成！</div>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
