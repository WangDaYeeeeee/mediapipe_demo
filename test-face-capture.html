<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>脸部图片捕获测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .test-area {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      color: white;
      font-size: 16px;
      font-weight: 500;
      width: 100%;
      max-width: 500px;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
      margin: 5px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 14px;
      text-align: left;
    }

    .video-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 20px 0;
    }

    #video {
      width: 100%;
      border-radius: 8px;
      background: #333;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .face-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .face-image {
      border: 2px solid #fff;
      border-radius: 8px;
      max-width: 150px;
      max-height: 150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="test-area">
      <h2>脸部图片捕获测试</h2>
      <p>测试MediaPipe脸部检测和图片裁剪功能</p>
      
      <div class="video-container">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
      </div>
      
      <button class="btn" id="startBtn">启动摄像头</button>
      <button class="btn" id="captureBtn" disabled>捕获脸部图片(180px)</button>
      <button class="btn" id="captureBtn120" disabled>捕获脸部图片(120px)</button>
      <button class="btn" id="captureBtn240" disabled>捕获脸部图片(240px)</button>
      <button class="btn" id="copyBtn" disabled>复制结果到剪切板</button>
      <button class="btn" id="clearBtn">清除图片</button>
      
      <div class="status" id="status">等待启动摄像头...</div>
      
      <div class="face-images" id="faceImages"></div>
    </div>
  </div>

  <script type="module">
    import { FaceDetector } from './src/face_detection.js';
    import { FaceLandmarker } from '@mediapipe/tasks-vision';

    class FaceCaptureTest {
      constructor() {
        this.video = document.getElementById('video');
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.startBtn = document.getElementById('startBtn');
        this.captureBtn = document.getElementById('captureBtn');
        this.captureBtn120 = document.getElementById('captureBtn120');
        this.captureBtn240 = document.getElementById('captureBtn240');
        this.copyBtn = document.getElementById('copyBtn');
        this.clearBtn = document.getElementById('clearBtn');
        this.status = document.getElementById('status');
        this.faceImages = document.getElementById('faceImages');
        
        this.faceDetector = null;
        this.cameraOn = false;
        this.capturedResults = []; // 存储捕获的结果
        
        this.bindEvents();
      }

      bindEvents() {
        this.startBtn.addEventListener('click', () => this.startCamera());
        this.captureBtn.addEventListener('click', () => this.captureFaceImage(180));
        this.captureBtn120.addEventListener('click', () => this.captureFaceImage(120));
        this.captureBtn240.addEventListener('click', () => this.captureFaceImage(240));
        this.copyBtn.addEventListener('click', () => this.copyToClipboard());
        this.clearBtn.addEventListener('click', () => this.clearImages());
      }



      async startCamera() {
        try {
          this.status.textContent = '正在启动摄像头...';
          this.startBtn.disabled = true;
          
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
              width: { ideal: 640 },
              height: { ideal: 480 }
            } 
          });
          
          this.video.srcObject = stream;
          this.video.onloadedmetadata = () => {
            this.resizeCanvas();
            this.cameraOn = true;
            this.captureBtn.disabled = false;
            this.captureBtn120.disabled = false;
            this.captureBtn240.disabled = false;
            this.copyBtn.disabled = false;
            this.status.textContent = '摄像头已启动，请正对摄像头';
            this.startDetection();
          };
          
        } catch (error) {
          this.status.textContent = '启动摄像头失败: ' + error.message;
          this.startBtn.disabled = false;
        }
      }

      resizeCanvas() {
        const rect = this.video.getBoundingClientRect();
        this.canvas.width = rect.width;
        this.canvas.height = rect.height;
        this.canvas.style.width = rect.width + 'px';
        this.canvas.style.height = rect.height + 'px';
      }

      async startDetection() {
        try {
          this.status.textContent = '正在加载人脸检测模型...';
          this.faceDetector = await FaceDetector.create();
          this.status.textContent = '模型加载完成，开始检测...';
          this.predictWebcam();
        } catch (error) {
          this.status.textContent = '模型加载失败: ' + error.message;
        }
      }

      predictWebcam() {
        if (!this.cameraOn) return;
        
        try {
          const result = this.faceDetector.detect(this.video);
          if (typeof result !== 'string') {
            this.drawFaceLandmarks(result);
          }
        } catch (error) {
          console.error('检测错误:', error);
        } finally {
          requestAnimationFrame(() => this.predictWebcam());
        }
      }

      drawFaceLandmarks(result) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        const faceLandmarks = result.faceLandmarks;
        const faceOval = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL;
        
        // 绘制脸部轮廓
        this.ctx.strokeStyle = '#00ff00';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        
        for (const conn of faceOval) {
          const point = faceLandmarks[conn.start];
          const x = point.x * this.canvas.width;
          const y = point.y * this.canvas.height;
          
          if (conn.start === faceOval[0].start) {
            this.ctx.moveTo(x, y);
          } else {
            this.ctx.lineTo(x, y);
          }
        }
        
        this.ctx.stroke();
      }

                     captureFaceImage(maxWidth = 180) {
          try {
            const result = this.faceDetector.detect(this.video);
            
            if (typeof result === 'string') {
              this.status.textContent = '人脸检测失败: ' + result;
              return;
            }

            // 模拟main.ts中的capturePhoto方法
            const { base64, mouthCenter } = this.capturePhoto({ 
              face: result, 
              maxWidth: maxWidth 
            });
            
            // 显示裁剪后的图片
            this.displayFaceImage(base64, maxWidth, maxWidth, mouthCenter);
            
            this.status.textContent = `成功捕获脸部图片，大小: ${maxWidth} x ${maxWidth}, 嘴部中心: (${mouthCenter.x.toFixed(1)}, ${mouthCenter.y.toFixed(1)})`;
            
            // 存储结果
            this.capturedResults.push({
              frame: base64.split(',')[1],
              time: Date.now() * 1000,
              x: mouthCenter.x,
              y: mouthCenter.y,
              size: maxWidth
            });
            
          } catch (error) {
            console.error('捕获脸部图片时发生错误:', error);
            this.status.textContent = '捕获失败: ' + error.message;
          }
        }

        async copyToClipboard() {
          if (this.capturedResults.length === 0) {
            this.status.textContent = '没有可复制的数据，请先捕获一些图片';
            return;
          }

          try {
            const data = {
              colorData: '1 120 3 2 3 3 1 1 ;ejEHAAMAAAAAAAAAeAAAAAAAAAD9D5BoAAAAAHYQBQAAAAAAAAAATOY1h/Ifv0by5jWH8gMAAAACAAAAAwAAAAUAAAAFAAAABQAAAAUAAAAFAAAABQAAAAUAAAAFAAAABQAAAAUAAAAFAAAABQAAAAUAAAAFAAAABQAAAAUAAAA=;5864ec2c19c7136fb09a1c7f6909cf3a',
              colorList: [
                "[0,0,0,76]", "[115,26,67,159]", "[230,53,135,242]", "[230,53,135,242]", "[230,53,135,242]", "[230,53,135,242]",
                "[31,191,70,242]", "[31,191,70,242]", "[31,191,70,242]", "[230,53,135,242]", "[230,53,135,242]", "[230,53,135,242]",
                "[230,53,135,242]", "[230,53,135,242]", "[115,26,67,159]", "[0,0,0,76]", "[204,204,204,17]",
              ],
              reflectFrames: this.capturedResults,
            };

            const jsonString = JSON.stringify(data, null, 2);
            
            // 使用现代Clipboard API
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(jsonString);
              this.status.textContent = `结果已复制到剪切板，包含 ${this.capturedResults.length} 帧数据`;
            } else {
              // 降级方案：使用传统的document.execCommand
              const textArea = document.createElement('textarea');
              textArea.value = jsonString;
              textArea.style.position = 'fixed';
              textArea.style.left = '-999999px';
              textArea.style.top = '-999999px';
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              
              const successful = document.execCommand('copy');
              document.body.removeChild(textArea);
              
              if (successful) {
                this.status.textContent = `结果已复制到剪切板，包含 ${this.capturedResults.length} 帧数据`;
              } else {
                this.status.textContent = '复制到剪切板失败';
              }
            }
          } catch (error) {
            console.error('复制到剪切板时发生错误:', error);
            this.status.textContent = '复制失败: ' + error.message;
          }
        }

               capturePhoto(extra) {
          // 创建临时canvas来捕获视频帧
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          
          tempCanvas.width = this.video.videoWidth;
          tempCanvas.height = this.video.videoHeight;
          
          // 绘制视频帧到canvas
          tempCtx.drawImage(this.video, 0, 0);
          
          // 获取脸部轮廓点
          const faceLandmarks = extra.face.faceLandmarks;
          const faceOval = FaceLandmarker.FACE_LANDMARKS_FACE_OVAL;
          
          // 计算脸部边界框
          let minX = Infinity, maxX = -Infinity;
          let minY = Infinity, maxY = -Infinity;
          
          for (const conn of faceOval) {
            const point = faceLandmarks[conn.start];
            const x = point.x * this.video.videoWidth;
            const y = point.y * this.video.videoHeight;
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
          }
          
          // 添加一些边距，确保完整捕获脸部
          const padding = Math.min(maxX - minX, maxY - minY) * 0.1;
          minX = Math.max(0, minX - padding);
          maxX = Math.min(this.video.videoWidth, maxX + padding);
          minY = Math.max(0, minY - padding);
          maxY = Math.min(this.video.videoHeight, maxY + padding);
          
          // 裁剪脸部区域
          const faceWidth = maxX - minX;
          const faceHeight = maxY - minY;
          
          // 确保裁剪区域有效
          if (faceWidth <= 0 || faceHeight <= 0) {
            throw new Error('脸部裁剪区域无效');
          }
          
          // 创建新的canvas来存储裁剪后的脸部图片
          const faceCanvas = document.createElement('canvas');
          const faceCtx = faceCanvas.getContext('2d');
          
          faceCanvas.width = faceWidth;
          faceCanvas.height = faceHeight;
          
          // 从原canvas裁剪脸部区域
          faceCtx.drawImage(
            tempCanvas,
            minX, minY, faceWidth, faceHeight,  // 源图像裁剪区域
            0, 0, faceWidth, faceHeight          // 目标canvas绘制区域
          );

          // 计算缩放比例
          const scale = Math.min(extra.maxWidth / faceWidth, extra.maxWidth / faceHeight);
          const scaledWidth = Math.round(faceWidth * scale);
          const scaledHeight = Math.round(faceHeight * scale);

          // 如果需要进行缩放
          if (scale < 1) {
            const scaledCanvas = document.createElement('canvas');
            const scaledCtx = scaledCanvas.getContext('2d');
            
            scaledCanvas.width = scaledWidth;
            scaledCanvas.height = scaledHeight;
            
            // 使用高质量缩放
            scaledCtx.imageSmoothingEnabled = true;
            scaledCtx.imageSmoothingQuality = 'high';
            
            // 绘制缩放后的图像
            scaledCtx.drawImage(
              faceCanvas,
              0, 0, faceWidth, faceHeight,      // 源图像区域
              0, 0, scaledWidth, scaledHeight   // 目标区域
            );
            
            // 获取原始视频中的嘴部中心点坐标
            const originalMouthCenter = this.faceDetector.detectMouthCenter(extra.face, {
              width: this.video.videoWidth,
              height: this.video.videoHeight,
            });
            
            // 坐标转换：原始视频坐标 -> 裁剪后坐标 -> 缩放后坐标
            const croppedMouthCenter = {
              x: originalMouthCenter.x - minX,
              y: originalMouthCenter.y - minY,
            };
            
            const scaledMouthCenter = {
              x: croppedMouthCenter.x * scale,
              y: croppedMouthCenter.y * scale,
            };
            
            return {
              base64: scaledCanvas.toDataURL('image/jpeg', 0.8),
              mouthCenter: scaledMouthCenter,
            };
          } else {
            // 不需要缩放，直接返回裁剪后的图片
            const originalMouthCenter = this.faceDetector.detectMouthCenter(extra.face, {
              width: this.video.videoWidth,
              height: this.video.videoHeight,
            });
            
            // 坐标转换：原始视频坐标 -> 裁剪后坐标
            const croppedMouthCenter = {
              x: originalMouthCenter.x - minX,
              y: originalMouthCenter.y - minY,
            };
            
            return {
              base64: faceCanvas.toDataURL('image/jpeg', 0.8),
              mouthCenter: croppedMouthCenter,
            };
          }
        }

             displayFaceImage(base64Data, width, height, mouthCenter = null) {
         const container = document.createElement('div');
         container.style.position = 'relative';
         container.style.display = 'inline-block';
         container.style.margin = '5px';
         
         const img = document.createElement('img');
         img.src = base64Data;
         img.className = 'face-image';
         img.title = `大小: ${width} x ${height}`;
         
         container.appendChild(img);
         
         // 如果提供了嘴部中心点，绘制一个标记
         if (mouthCenter) {
           const marker = document.createElement('div');
           marker.style.position = 'absolute';
           marker.style.left = `${mouthCenter.x}px`;
           marker.style.top = `${mouthCenter.y}px`;
           marker.style.width = '4px';
           marker.style.height = '4px';
           marker.style.backgroundColor = 'red';
           marker.style.borderRadius = '50%';
           marker.style.transform = 'translate(-50%, -50%)';
           marker.style.pointerEvents = 'none';
           marker.title = `嘴部中心: (${mouthCenter.x.toFixed(1)}, ${mouthCenter.y.toFixed(1)})`;
           
           container.appendChild(marker);
         }
         
         this.faceImages.appendChild(container);
       }

              clearImages() {
          this.faceImages.innerHTML = '';
          this.capturedResults = [];
          this.status.textContent = '图片和捕获数据已清除';
        }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', () => {
      new FaceCaptureTest();
    });
  </script>
</body>
</html>
